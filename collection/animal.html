body{background-color:#e3ece3;background-image:radial-gradient(ellipse at 14% 10%,#fff9df 0,transparent 48%),linear-gradient(135deg,transparent 55%,#ccdfd4)}main{background:#fbfcf2;border-color:#adbfab}.art{background:linear-gradient(#cedfd8,#edf0d9 78%,#d2ddc8)}.sun{background:#f7df9b;box-shadow:0 0 28px 10px #ffedbd80}.art:before,.art:after{clip-path:polygon(0 100%,0 62%,6% 16%,12% 68%,16% 36%,22% 75%,29% 12%,36% 68%,40% 40%,47% 88%,55% 30%,63% 81%,69% 18%,77% 72%,83% 34%,89% 75%,95% 6%,100% 52%,100% 100%);background:#8fae9e}.art:after{background:#486f60;inset:50% -4% -5%}</style><header><i>鉴</i> 你是什么小动物人格<a href="index.html" style="margin-left:auto;font-size:14px;color:inherit">测试合集</a></header><main id="page"></main><footer>趣味人格测试 · 仅供娱乐，不作专业心理诊断</footer><script>
const rows=`搬到森林的第一个清晨，你最想做什么？|沿溪流拜访新邻居|记下水源和回家路线|坐在树下听清晨的声音

出门旅行，你最期待哪个瞬间？|临时改道发现小店|按计划赶上山顶日出|坐在窗边看远山
整理房间时，什么让你最满足？|试出一种全新布局|每件东西都有固定位置|留出一角晒太阳
早餐摊今天没开，你会？|跟着香味找新摊|去备用的那家店|回家慢慢煮碗面
你更喜欢怎样记日记？|随手录一段街头见闻|列三点今天的收获|写下难忘的一句话
第一次做一道菜，你倾向于？|大胆换成喜欢的配料|称好材料再开火|边尝边调到熟悉的味道
排队时多出十分钟，你会？|和旁边的人聊两句|确认接下来的安排|观察路人的表情
朋友聚餐订不到位，你会？|带大家直接去隔壁看看|核对人数和附近空位|先问谁走累了
小组任务卡住了，你会？|先做个样品给大家看|画出问题之间的关系|听听迟迟没开口的人
搬家只能先开一个箱子，你选？|工具箱，动手搭家具|贴着必需品标签的箱子|床品，让晚上睡得安稳
新爱好遇到瓶颈，你会？|换种玩法试一次|把难点拆开单练|歇两天找回兴趣
两项任务撞期，你会？|立刻找人协作|排出依赖和优先级|商量彼此能接受的节奏
雨打乱了户外活动，你想？|发起临时室内游戏|根据天气重排路线|坐在屋檐下听雨
旧物坏了，你第一反应是？|拆开试着修|查清故障和维修成本|想想它陪过自己的日子
面对陌生路线，你会？|先走到路口看看|存好离线地图|挑一条安静的小路
聚会上无人开场，你会？|抛个有趣的话题|介绍大家的共同点|先跟身边的人轻聊
朋友被误解，你会？|当场替朋友说句话|还原事情的前因后果|陪朋友出去透口气
群聊里约旅行，你最常发？|谁愿意一起出发|一份可投票的日期表|这处风景你们会喜欢
收到意外礼物，你会？|立刻打电话表达惊喜|记住对方最近需要什么|把卡片夹进喜欢的书
新同事午休独坐，你会？|邀请对方一起吃饭|介绍附近几家餐馆|点头示意让对方自在
讨论中出现分歧，你更愿意？|说出立场推动表决|找出双方默认的前提|问问双方最在意什么
朋友想学你的拿手活，你会？|拉过来一起上手|整理一张步骤清单|从对方最喜欢的部分教起
你最想怎样庆祝生日？|办一场热闹的主题聚会|安排一次期待已久的行程|和知己吃顿家常饭
努力落空时，你通常？|找个新目标再冲一次|复盘哪个环节能调整|给自己留一晚消化
被临时点名发言，你会？|想到什么就先开口|用三个关键词串起思路|从自己的真实感受讲起
烦躁时什么最管用？|出门跑到出汗|写清能掌控的事情|戴耳机听完整张专辑
收到尖锐反馈，你先？|找对方直接聊聊|挑出可验证的部分|等心情平静再读一次
等待重要消息，你会？|主动询问进度|准备不同结果的方案|去花园待一会儿
做成一件难事，你想？|喊上伙伴庆祝|记下可复用的方法|安静回味那一刻
朋友情绪低落，你倾向于？|带人出门换个环境|帮忙梳理烦恼的来源|陪坐到对方愿意说话
生活连续忙乱几天，你会？|推掉一件事夺回主动权|重新安排每天的时间|留一个独处的傍晚
逛市集最吸引你的是？|可以现场体验的摊位|精巧的机械装置|手写诗笺与旧照片
看电影你最容易记住？|主角挺身而出的瞬间|早早埋下的伏笔|片尾沉默的空镜头
空白笔记本你想用来？|记录想尝试的挑战|跟踪一个长期项目|收集梦境和灵感
选一项周末活动，你选？|即兴戏剧体验|解谜桌游|植物写生
住进山间小屋，你最想？|沿山径去探路|研究小屋的木作结构|守着窗看雾散
听播客你偏爱哪种内容？|冒险者的亲身经历|复杂事情的来龙去脉|普通人的生活片段
自己办个小展，你想展出？|路上遇见的人和故事|一件作品的制作全过程|四季里同一扇窗
假期结束，什么值得带回家？|下次同行的新朋友|一张亲手标注的地图|海边拾到的光滑石头`.split('\n').map(line=>line.split('|'));
const profiles=[["河狸", "森林", "先搭好桥，再邀请大家过河", "河狸", "你享受把复杂任务拆成小步骤。", "帮团队把点子落到实处。", "你的工具箱按使用频率排序。"], ["牧羊犬", "森林", "集合啦，一个伙伴都不能少", "牧羊犬", "你常一边行动，一边照看集体节奏。", "把散落的伙伴组织起来。", "你的散步路线有集合点。"], ["赤狐", "森林", "小径的转角总有新发现", "赤狐", "你行动灵活，也喜欢捕捉生活细节。", "察觉别人忽略的机会。", "你知道林子里最好看的那片光。"], ["水獭", "森林", "先下水，快乐就有了开头", "水獭", "你倾向于用行动开启体验。", "把冷场变成大家能加入的游戏。", "你口袋里藏着一颗想送人的石子。"], ["梅花鹿", "森林", "风还没停，你已经听见了", "梅花鹿", "你对气氛和细节格外敏锐。", "替大家发现环境里的小变化。", "你能认出朋友靠近时的脚步声。"], ["雪豹", "森林", "静静看清，再轻轻落脚", "雪豹", "你喜欢观察环境，再决定行动路线。", "独处时找到解决问题的捷径。", "你的秘密路线从不堵车。"], ["树懒", "森林", "慢一点，才赶得上这场晚霞", "树懒", "你重视自己的步调，享受安静时刻。", "提醒伙伴停下来恢复精力。", "你的黄金座位永远朝向夕阳。"]];
const page=document.querySelector('#page'),art='<div class="art" aria-hidden="true"><span class="sun"></span></div>';let answers=[],index=0;
function home(){page.innerHTML=art+'<article><small>生活性情卷 · 四十问</small><h1>你是什么小动物人格</h1><p>把一天的生活放进森林，你会是哪位邻居？</p><button class="primary" onclick="start()">展开问卷　→</button></article>'}
function start(){answers=[];index=0;question()}
function dim(i,k){return k===2?(i%2?3:2):k}
function question(){const row=rows[index];page.innerHTML='<article><small>'+['日常习惯','处事方式','社交模式','情绪反应','兴趣偏好'][Math.floor(index/8)]+'　／　'+(index+1)+' / 40</small><progress aria-label="已答题数" value="'+index+'" max="40"></progress><h2 tabindex="-1">'+row[0]+'</h2><nav>'+[0,1,2].map((_,j)=>{const k=(j+index)%3;return '<button onclick="pick('+k+')"><b>'+['甲','乙','丙'][j]+'</b>'+row[k+1]+'</button>'}).join('')+'</nav>'+(index?'<button onclick="index--;question()">← 上一题</button>':'')+'</article>';page.querySelector('h2').focus()}
function pick(k){answers[index]=dim(index,k);if(++index===rows.length)result();else question()}
// 每一题以随机选择时的期望分为基准；抵消各维度出现次数不同的影响。
// 各画像按其方向上分数的标准差归一化，保留轻微但稳定的个人偏好。
function match(answers){
 const weights=[[0,1,0,0],[1,1,-.5,-.5],[.6,-.6,1,0],[1,0,0,0],[0,0,1,0],[0,.65,-.3,1],[0,0,0,1]];
 let best=-Infinity,winner=0;
 weights.forEach((w,p)=>{
   let sum=0,variance=0;
   answers.forEach((choice,i)=>{
     const values=[0,1,2].map(k=>w[dim(i,k)]);
     const mean=values.reduce((a,b)=>a+b,0)/3;
     sum+=w[choice]-mean;
     variance+=values.reduce((v,n)=>v+(n-mean)**2,0)/3;
   });
   const score=sum/Math.sqrt(variance);
   if(score>best){best=score;winner=p}
 });
 return winner;
}function result(){const p=profiles[match(answers)];page.innerHTML=art+'<article><small>你是什么小动物人格　／　'+p[1]+'卷</small><h1 tabindex="-1">'+p[0]+'</h1><blockquote>'+p[2]+'</blockquote><dl>'+['性格特点','匹配理由','隐藏优势','趣味彩蛋'].map((label,i)=>'<dt>'+label+'</dt><dd>'+(i===0?p[4]:i===1?'你的四十次选择中，最突出的倾向与「'+p[0]+'」相合。':p[i+3])+'</dd>').join('')+'</dl><button onclick="start()">重新测试　↻</button></article>';page.querySelector('h1').focus()}
home();
</script></html>
